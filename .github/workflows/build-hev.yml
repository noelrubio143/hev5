name: Build hev-socks5-tunnel (Android JNI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "hev-socks5-tunnel tag (e.g. 2.20.0)"
        required: true
        default: "2.20.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone hev-socks5-tunnel
        run: |
          mkdir hev-build && cd hev-build
          git clone --recursive --depth 1 --branch "${{ inputs.version }}" \
            https://github.com/heiher/hev-socks5-tunnel jni

      - name: Build with ndk-build
        working-directory: hev-build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          "$NDK/ndk-build" \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM=android-24 \
            -j"$(nproc)"

      - name: Collect and verify
        run: |
          mkdir -p out/arm64-v8a out/armeabi-v7a
          cp hev-build/libs/arm64-v8a/libhev-socks5-tunnel.so out/arm64-v8a/
          cp hev-build/libs/armeabi-v7a/libhev-socks5-tunnel.so out/armeabi-v7a/
          file out/*/*.so
          for f in out/*/*.so; do
            echo "== $f"
            nm -D --defined-only "$f" | grep -E "JNI_OnLoad|TProxy|hev_socks5_tunnel" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhev-socks5-tunnel-${{ inputs.version }}
          path: out/
